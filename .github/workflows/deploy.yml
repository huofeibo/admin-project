name: Deploy portfolio

on:
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

env:
  IMAGE_NAME: admin-project

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/admin-project-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress image archive
        run: gzip -1 /tmp/admin-project-image.tar

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload image and deployment script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "${DEPLOY_PORT:-22}" \
            scripts/deploy-image.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/admin-project-deploy-image.sh"
          scp \
            -i ~/.ssh/deploy_key \
            -P "${DEPLOY_PORT:-22}" \
            /tmp/admin-project-image.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/admin-project-image.tar.gz"

      - name: Deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "gzip -dc /tmp/admin-project-image.tar.gz | docker load && rm -f /tmp/admin-project-image.tar.gz && chmod +x /tmp/admin-project-deploy-image.sh && /tmp/admin-project-deploy-image.sh '$IMAGE_REF'"

      - name: Verify public routes
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://huoyb-api.cloud/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://huoyb-api.cloud/wuji > /dev/null
