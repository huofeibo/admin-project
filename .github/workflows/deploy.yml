name: Deploy portfolio

on:
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment bootstrap
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "${DEPLOY_PORT:-22}" \
            scripts/deploy-source.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/admin-project-deploy-source.sh"

      - name: Deploy image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /tmp/admin-project-deploy-source.sh && /tmp/admin-project-deploy-source.sh 'https://github.com/huofeibo/admin-project.git' '$DEPLOY_REVISION'"

      - name: Verify public routes
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://huoyb-api.cloud/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://huoyb-api.cloud/wuji > /dev/null
