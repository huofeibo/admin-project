name: Deploy portfolio

on:
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package deployment source
        run: |
          git archive \
            --format=tar.gz \
            --output=/tmp/admin-project-source.tar.gz \
            "$GITHUB_SHA"
          test -s /tmp/admin-project-source.tar.gz

      - name: Upload deployment source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P "${DEPLOY_PORT:-22}" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            scripts/deploy-source.sh \
            /tmp/admin-project-source.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Build and deploy on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x /tmp/deploy-source.sh && /tmp/deploy-source.sh '/tmp/admin-project-source.tar.gz' '$DEPLOY_REVISION'"

      - name: Verify public routes
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://huoyb-api.cloud/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://huoyb-api.cloud/wuji > /dev/null
